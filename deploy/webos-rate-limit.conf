# Rate limiting zones for odin.micutu.com (WebOS).
# Installed to /etc/nginx/conf.d/webos-rate-limit.conf (http context).
#
# $binary_remote_addr is the real client IP because the vhost includes
# snippets/cloudflare-realip.conf, which rewrites it from CF-Connecting-IP
# for Cloudflare edge peers only.

# Page loads. Generous — it's a static shell.
limit_req_zone $binary_remote_addr zone=webos_http:10m rate=60r/m;

# WebSocket upgrades. Each one costs the backend a connection slot, so the
# handshake rate is capped much harder than plain page loads.
limit_req_zone $binary_remote_addr zone=webos_ws:10m rate=20r/m;

# Concurrent connections per IP. This is the important one: the backend used
# to accept unbounded connections and spawn a thread per connection, so a
# single host could exhaust it. Capped at the edge as well as in the app.
limit_conn_zone $binary_remote_addr zone=webos_conn:10m;
