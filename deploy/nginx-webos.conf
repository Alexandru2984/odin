# odin.micutu.com — WebOS (Odin backend on 127.0.0.1:47271)
# Installed to /etc/nginx/sites-available/webos, symlinked into sites-enabled.

server {
    include snippets/block-dotfiles.conf;
    include snippets/cloudflare-realip.conf;
    server_name odin.micutu.com;

    # Reject anything that did not arrive through Cloudflare.
    #
    # Without this the origin IP serves odin.micutu.com to anyone who sends
    # the right Host header, and the whole edge — WAF, DDoS protection, the
    # bot rules — is one DNS-history lookup away from being skipped. The
    # limits below still apply, but they are the last line, not the only one.
    #
    # realip does NOT cover this on its own: it only refuses to *believe*
    # CF-Connecting-IP from a non-Cloudflare peer, it does not refuse to
    # serve them. Loopback is allowed by the guard, so local health checks
    # and `curl 127.0.0.1` keep working.
    #
    # $from_cloudflare_origin comes from conf.d/cloudflare-origin-guard.conf,
    # which is regenerated by scripts/update-cloudflare-ips.sh.
    if ($from_cloudflare_origin = 0) { return 403; }

    # Terminal sessions are long-lived and mostly idle; nginx's default
    # 60s proxy_read_timeout was silently killing every WebSocket after a
    # minute of no keystrokes, which is what the reconnect loop in the
    # backend logs actually was.
    location /ws {
        limit_req  zone=webos_ws burst=10 nodelay;
        limit_conn webos_conn 8;

        proxy_pass http://127.0.0.1:47271;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        # No sub_filter here on purpose: the analytics injection lives in
        # `location /` only, so it never touches the WebSocket stream.
    }

    # Metrics are for a scraper on this host, not for the internet.
    #
    # The backend refuses anything carrying proxy headers, so removing this
    # block would not actually expose the endpoint — the two controls are
    # deliberately independent, and this one is the cheap outer layer.
    # Prometheus should scrape http://127.0.0.1:47271/metrics directly.
    location = /metrics {
        deny all;
        access_log off;
    }

    location / {
        limit_req  zone=webos_http burst=20 nodelay;
        limit_conn webos_conn 8;

        proxy_pass http://127.0.0.1:47271;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout 5s;

        # Umami analytics injection (HTML responses only).
        sub_filter '</head>' '    <script defer src="https://analytics.micutu.com/script.js" data-website-id="c47de079-f066-4be5-a4bc-7aaaa530acb9"></script></head>';
        sub_filter_once on;
        # sub_filter_types defaults to text/html, which is exactly what we want.
    }

    # Custom CSP for this vhost — see the snippet header for why the shared
    # snippets/security-headers.conf must NOT also be included here.
    include snippets/security-headers-webos.conf;
    include snippets/robots.conf;

    client_max_body_size 64k;
    client_body_timeout  10s;
    client_header_timeout 10s;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/odin.micutu.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/odin.micutu.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    include snippets/block-dotfiles.conf;
    if ($host = odin.micutu.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name odin.micutu.com;
    return 404; # managed by Certbot
}
