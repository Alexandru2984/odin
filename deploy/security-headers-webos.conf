# Security headers for odin.micutu.com (WebOS).
#
# Based on the shared snippet, but with a CSP that this app can actually run
# under. The shared snippet's `default-src 'self'` was silently breaking the
# site: index.html loaded xterm.js from cdn.jsdelivr.net, CSP blocked it, and
# every visitor got a blank page. Assets are now self-hosted, so 'self' is
# correct — the only additions are the Umami beacon that nginx injects via
# sub_filter, and an explicit wss: origin for the terminal's WebSocket.
#
# Cloudflare Web Analytics is the third exception. Cloudflare injects
# <script src="https://static.cloudflareinsights.com/beacon.min.js"> into the
# response itself, downstream of nginx, so there is nothing here to turn off:
# either the CSP names the host or every visitor gets a console error and no
# RUM data. The beacon then POSTs to https://cloudflareinsights.com, which is a
# separate host and so needs its own connect-src entry.
#
# NOTE: nginx add_header inheritance is replace-not-merge per block, and two
# CSP headers on one response are intersected by the browser. This vhost must
# therefore include THIS file and never snippets/security-headers.conf.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff"                             always;
add_header X-Frame-Options           "DENY"                                always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://analytics.micutu.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://odin.micutu.com https://analytics.micutu.com https://cloudflareinsights.com; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;" always;
