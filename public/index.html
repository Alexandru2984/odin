<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the layout can reach under a phone's rounded
     corners and home indicator, which the safe-area insets then pad back. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0f10">
<title>WebOS — a shared terminal</title>
<meta name="description" content="A multi-user terminal in your browser. Shared filesystem, real shell, written in Odin.">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">

<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="app">
  <header id="statusbar">
    <div class="sb-left">
      <span id="conn-dot" class="dot connecting" aria-hidden="true"></span>
      <span id="conn-label" role="status" aria-live="polite">connecting</span>
    </div>

    <div class="sb-title">
      <span class="brand">webos</span><span class="brand-dim">@odin</span>
    </div>

    <div class="sb-right">
      <button id="btn-font-out" class="sb-btn" type="button" title="Smaller text" aria-label="Smaller text">A&minus;</button>
      <button id="btn-font-in" class="sb-btn" type="button" title="Larger text" aria-label="Larger text">A+</button>
      <button id="btn-theme" class="sb-btn" type="button" title="Change theme" aria-label="Change theme">◐</button>
    </div>
  </header>

  <main id="terminal-host">
    <div id="terminal"></div>
    <canvas id="matrix" aria-hidden="true"></canvas>

    <!-- Shown when the socket drops, so the screen is never just frozen. -->
    <div id="offline" class="hidden" role="alert">
      <div class="offline-card">
        <div class="offline-title">connection lost</div>
        <div class="offline-sub" id="offline-detail">reconnecting…</div>
        <button id="btn-retry" class="offline-btn" type="button">reconnect now</button>
      </div>
    </div>
  </main>

  <!-- Keys a touch keyboard has no way to send. Hidden unless the device is
       actually touch-driven; a desktop has these keys already. -->
  <nav id="keybar" class="hidden" aria-label="Terminal keys">
    <button class="key" data-send="\x1b" type="button">esc</button>
    <button class="key" data-send="\t" type="button">tab</button>
    <button class="key" id="key-ctrl" data-modifier="ctrl" type="button">ctrl</button>
    <button class="key" data-send="\x1b[A" type="button">↑</button>
    <button class="key" data-send="\x1b[B" type="button">↓</button>
    <button class="key" data-send="\x1b[D" type="button">←</button>
    <button class="key" data-send="\x1b[C" type="button">→</button>
    <button class="key" data-send="|" type="button">|</button>
    <button class="key" data-send="/" type="button">/</button>
    <button class="key" data-send="-" type="button">-</button>
    <button class="key" data-send="$" type="button">$</button>
    <button class="key wide" data-send="\r" type="button">enter</button>
  </nav>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
